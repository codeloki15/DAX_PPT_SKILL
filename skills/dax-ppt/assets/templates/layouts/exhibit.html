<div class="slide-container">
  <div class="kicker">{{kicker}}</div>
  <div class="action">{{title}}</div>
  <div class="rule"></div>
  <div class="content stack">
    <p class="lead">{{lead}}</p>
    <div class="panel">
      <div class="panel-t">{{panel_title}}</div>
      <div class="panel-s">{{panel_subtitle}}</div>
      <!-- SLOT exhibit: one large chart embed or one table -->
      <div class="slot" style="flex:1;">Replace with the exhibit: chart embed_html or a table</div>
    </div>
    <!-- SLOT takeaway: paste `dax.py exhibit --type takeaway` -->
    <div class="slot">Replace with the takeaway exhibit: dax.py exhibit --type takeaway</div>
  </div>
  <div class="src"><b>Source:</b> {{source}}</div>
  <div class="foot"><span>{{exhibit_label}}</span><span>Data Axle &nbsp;|&nbsp; {{deck}} &nbsp;|&nbsp; {{page}}</span></div>
</div>
